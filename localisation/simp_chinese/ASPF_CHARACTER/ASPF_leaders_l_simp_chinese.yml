 # IRQ
 IRQ_SaddamHussein: "萨达姆 侯赛因"
 IRQ_SaddamHussein_desc: "“如果在沙漠中遇到了敌人和毒蛇，我们要做的是先打死敌人，然后才是毒蛇”\n\n1998年，一个奇异的年份。克林顿的“沙漠之狐”行动如同悬在头顶的达摩克利斯之剑，蠢蠢欲动。联合国的核查员如同跗骨之蛆，在他神圣的“国家主权”殿堂里翻箱倒柜，寻找那可能并不存在、或早已深埋地底的“大规模杀伤武器”的幽灵。每一次驱逐核查员，每一次边境的摩擦（在无人知晓的“萨巴阿农场”），都是一场精心编排的、绝望的舞蹈，在悬崖边缘试探着西方那已然枯竭的耐心。这是一场没有赢家的猫鼠游戏，赌注是整个国家的命运，而他——萨达姆.侯赛因，是唯一不愿、也不能退场的赌徒。\n\n七年了。自那场将幼发拉底河染红、将美索不达米亚平原化为焦土的“母狮之辱”（海湾战争）后，七年了。制裁的铁幕从未如此沉重地落下，勒紧了这个古老国度的咽喉。物资匮乏如同瘟疫般蔓延，巴格达的灯火在黄昏中次第熄灭，留下无边的、饥饿的黑暗。然而，在这黑暗的核心，他依然矗立。像一座被风沙侵蚀却拒绝倒塌的巴比伦塔，固执地指向一个早已失落的、泛阿拉伯主义的烈日。\n\n他是提克里特的雄狮，是的。但如今，这头雄狮被困在了一座镀金的囚笼里。囚笼之外，是虎视眈眈的猎人，是饥饿的子民，是被诅咒的土地。囚笼之内，是永不熄灭的野心之火，在制裁的寒风中摇曳，映照着他愈发孤绝的身影。1998年的他，不再仅仅是伊拉克的统治者。他已成为一个活生生的象征，一个在缓慢窒息中咆哮的、注定悲剧的国家灵魂的具象化。\n\n未来？未来是一片模糊的沙暴。他所能做的，只是抓紧手中的权杖，握紧腰间的枪，用钢铁般的意志对抗着正在吞噬他和他所建造的一切的无形巨兽。直到……直到最后一颗子弹，或者最后一粒沙尘落下。\n\n“或许……在一切都结束前……我能留下什么……”"
