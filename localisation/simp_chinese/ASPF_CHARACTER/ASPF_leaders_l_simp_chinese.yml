 # GER
 GER_HelmutKohl: "赫尔穆特 科尔"
 GER_RomanHerzog: "罗曼 赫尔佐克"
 GER_RomanHerzog_desc: "事实证明，多么贫瘠的土地也能开出希望的花朵；事实也这样证明了：在恐怖体质下的国家也会有自由斗士和民主政治家。就比如德国。\n\n1934年出生的他并没有被希特勒的“高明手段”所欺诈而成为民族主义的傀儡。\n\n13岁的他已经学会了大部分都拉丁语，战后也继续保持着这种天才般的学习速度，1965年的他已经担任柏林自由大学法学系的主任，这样看来他一辈子也不会去接触其他事务：他已经事业有成，没有理由去从头再来。\n\n但在1970年入基民党的他似乎不会再有大成就，但仅仅二十年，他就成为了德意志的总统——\n\n虽然总统只是德意志的象征。"
 # IRQ
 IRQ_SaddamHussein: "萨达姆 侯赛因"
 IRQ_SaddamHussein_desc: "“如果在沙漠中遇到了敌人和毒蛇，我们要做的是先打死敌人，然后才是毒蛇”\n\n1998年，一个奇异的年份。克林顿的“沙漠之狐”行动如同悬在头顶的达摩克利斯之剑，蠢蠢欲动。联合国的核查员如同跗骨之蛆，在他神圣的“国家主权”殿堂里翻箱倒柜，寻找那可能并不存在、或早已深埋地底的“大规模杀伤武器”的幽灵。每一次驱逐核查员，每一次边境的摩擦（在无人知晓的“萨巴阿农场”），都是一场精心编排的、绝望的舞蹈，在悬崖边缘试探着西方那已然枯竭的耐心。这是一场没有赢家的猫鼠游戏，赌注是整个国家的命运，而他——萨达姆.侯赛因，是唯一不愿、也不能退场的赌徒。\n\n七年了。自那场将幼发拉底河染红、将美索不达米亚平原化为焦土的“母狮之辱”（海湾战争）后，七年了。制裁的铁幕从未如此沉重地落下，勒紧了这个古老国度的咽喉。物资匮乏如同瘟疫般蔓延，巴格达的灯火在黄昏中次第熄灭，留下无边的、饥饿的黑暗。然而，在这黑暗的核心，他依然矗立。像一座被风沙侵蚀却拒绝倒塌的巴比伦塔，固执地指向一个早已失落的、泛阿拉伯主义的烈日。\n\n他是提克里特的雄狮，是的。但如今，这头雄狮被困在了一座镀金的囚笼里。囚笼之外，是虎视眈眈的猎人，是饥饿的子民，是被诅咒的土地。囚笼之内，是永不熄灭的野心之火，在制裁的寒风中摇曳，映照着他愈发孤绝的身影。1998年的他，不再仅仅是伊拉克的统治者。他已成为一个活生生的象征，一个在缓慢窒息中咆哮的、注定悲剧的国家灵魂的具象化。\n\n未来？未来是一片模糊的沙暴。他所能做的，只是抓紧手中的权杖，握紧腰间的枪，用钢铁般的意志对抗着正在吞噬他和他所建造的一切的无形巨兽。直到……直到最后一颗子弹，或者最后一粒沙尘落下。\n\n“或许……在一切都结束前……我能留下什么……”"
 # ISR
 ISR_BenjaminNetanyahu: "本雅明 内塔尼亚胡"
 ISR_BenjaminNetanyahu_desc: "权力是流沙砌成的圣殿。1998年的耶路撒冷，本雅明·内塔尼亚胡站在流沙中央。\n\n\n他掌中的以色列是一块被诅咒的应许之地——§Y六日战争的荣光早已褪色，赎罪日的伤口仍在渗血。§!奥斯陆协议的墨迹未干，巴勒斯坦人举起石块的手与犹太人攥紧定居点图纸的手，在隔离墙的倒影里死死绞缠。而他，这个在美国麻省理工学院习得博弈论的精英，却将和平方程式改写为赤裸的生存法则：“§Y安全换和平§!”。土地？一寸不让。妥协？那是懦夫的毒药。\n\n鹰隼般的目光扫过联合国讲稿上“两国方案”的字样时，他的嘴角会浮起一丝刀锋般的笑。那些天真的国际主义者不懂——或者说拒绝懂——他的真理：§Y和平从不诞生于善意，它只匍匐于威慑的枪口之下§!。阿拉伯人只尊重力量？那就给他们力量。更多的坦克碾过约旦河谷，更多的哨塔刺入伯利恒的天空，更多定居点的混凝土吞噬着巴勒斯坦人眼中“未来国度”的残骸。每一次推土机的轰鸣，都是他对历史的复仇：为兄长约纳坦在恩德培陨落的灵魂，为那些被恐怖主义撕碎的夜晚。\n\n然而流沙正在吞噬他的圣殿。克林顿在华盛顿拍着他的肩，眼底却结着冰霜；拉宾的幽灵在街头示威者的标语上冷笑；利库德集团内部，叛徒的低语如蛇信嘶嘶。他嗅到空气中的背叛——美国助理国务卿的皱眉，党内元老避开他目光的瞬间，报纸头版将他描绘成“和平绞杀者”的粗体标题。“§Y比比”（Bibi）§!”，他们亲昵地唤他的昵称，可这昵称如今裹着蜜糖与砒霜。\n\n最深的阴影来自东方。德黑兰的诅咒像放射性尘埃飘过戈兰高地，哈马斯的人体炸弹在迪岑戈夫街炸开血花。每当警报撕裂夜空，他便站在官邸防弹玻璃后凝视黑暗——§Y那里没有巴勒斯坦国的轮廓，只有伊朗核计划的阴云。§!他的手指在加密电话上悬停，盘算着是否该将“摩萨德之刃”刺向更远的标靶26。\n\n1998年5月，他飞往北京。紫禁城的红墙下，他微笑握手，承诺“恪守一个中国”。可转身时，西装内袋里那份扩建东耶路撒冷定居点的密令，正随心跳发烫。分裂的人格在镁光灯下完美缝合：§Y国际舞台的务实玩家，犹太堡垒的偏执守护神。§!\n\n此刻的他，是走钢丝的人。左手拽着美国援助的绳索，右手挥动民族主义的火炬。脚下深渊回响着两种审判：海牙的法庭？抑或是《圣经》中神对僭越者的雷霆？钢丝在风中呜咽，而他收紧核心，拒绝低头——因为流沙之上的王......\n\n§Y唯一的选择是将自己浇筑成雕像，哪怕地基是千万人的骸骨......§!"
 ISR_EzerWeizman: "埃泽尔 魏茨曼"
 ISR_EzerWeizman_desc: "§Y“当石头有了心，它便成了祭坛”§!\n\n\n犹太谚语在总统府的穹顶下凝成霜。这位曾撕裂阿拉伯天空的§Y“以色列之鹰”§!，如今翅膀正被1998年的寒风一根根折断。\n\n他的办公室弥漫着旧皮革与硝烟褪尽后的腐朽气息。书架上，《奥斯陆协议》文本被压在“六日战争”回忆录下方，封面如干涸的血痂。窗外推土机的轰鸣日夜啃噬土地——那是内塔尼亚胡的利爪在撕碎他亲手缝制的和平蓝图。§Y“雄狮不会与豺狼分享猎场”§!，总理府传来的冷笑刺穿墙壁。魏茨曼摩挲着左颊的伤疤（1970年西奈半岛坠机遗痕），忽然觉得那并非荣耀勋章，而是命运烙下的§Y先知之耻§!：他预见和平，却无人聆听。\n\n阿尔茨海默症的迷雾已开始啃噬记忆的羊皮卷。有时他会对着空军旧部喊出阵亡者的名字，有时在深夜惊醒，将防弹窗的月光错认成米格战机炮火。但最痛的清醒来自§Y背叛§!：昔日他提携的“幼鹰”内塔尼亚胡，正将他的理想主义钉上十字架。当定居点蚕食约旦河西岸时，总统的谴责沦为报纸内页的铅字——权力早已从总统府流向总理官邸，唯留这具空壳在仪式性微笑中腐朽。\n\n他仍会倔强地飞往开罗或安曼，像二十年前那样紧握阿拉伯对手的手。可掌心的温度提醒他：§Y萨达特已死于刺客子弹，侯赛因国王在病榻喘息，而他成了和平葬礼上最后的守墓人§!。归航时，专机掠过伯利恒上空，他看见定居点的探照灯如新铸的长矛刺向巴勒斯坦村落——那正是他任国防部长时（1977-1980）亲手批准建造的武器。\n\n1998年平安夜，他独自走向锡安山墓地。枯叶在脚下碎裂如骨殖。墓碑群中，他停在一块无名石前——那里埋着某次空袭中误杀的阿拉伯孩童的衣物。雪茄终于点燃，青烟扭曲成阿拉伯语的“原谅”（Maghfira），却被风撕碎。远处圣诞颂歌隐约飘来，他想起另一句谚语：§Y“天使坠落时，羽毛也会变成刀”。§!\n\n此刻他伫立之处，正是鹰翼坠落的终点。"
