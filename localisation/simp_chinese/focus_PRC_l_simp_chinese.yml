 # PRC 00
 # 軍改國策 MR
 PRC_00_MR_01: "海湾战争的警钟" #######
 PRC_00_MR_02: "设立总装备部"
 PRC_00_MR_02_desc: "现代战争需要完善的装备体系，现有的装备制度完全无法适应，我们需要一个新的部门，这个部门能统一全军的发展计划，装备新的武器，使用新的体系，来适应新时期的战争需要。"
 PRC_00_MR_03: "禁止军队经商"
 PRC_00_MR_03_desc: "虽然军队经商是几年前中央军委为了经济建设专门放开过的，虽然军队经商也缓解了我们财政上的不足，也促进了市场的发展。但我们不得不承认的是，军队经商的利只能维持一时，而之后的弊端会越来越大，前不久的两个案子就是最直接的证据。军人的本质是打仗，什么经商之类腐蚀军队战斗力的全给我见鬼去吧！"
 PRC_00_MR_04: "世纪交替的军改"
 PRC_00_MR_04_desc: "千禧年将至，以北约为首的西方国家失去了苏联的威胁，我们不得不重视这个难以想象的战斗力。眼下，我国经济刚刚开始有起色，犯罪率也开始降低，我们的军改任务越来越重，国外的武装势力正对我们虎视眈眈，我们必须在这个特殊的时候完成我们的军事改革。"
 PRC_00_MR_05: "推进指挥自动化"
 PRC_00_MR_05_desc: "如果士兵是一只部队的身体，那么指挥官就是他的脑袋。传统的指挥方式效率低下，且遇到突发情况难以应对，指挥链的自动化不仅能加快我们的指挥效率，还能为我们的军队战力带来大幅度提升。"
 PRC_00_MR_LAND_01: "陆军改革"
 PRC_00_MR_LAND_01_desc: "1991年的海湾战争如同一面棱镜，折射出工业时代战争与信息时代战争的鸿沟。它不仅惊醒了中国的军事改革，更重塑了国防现代化的底层逻辑：打赢战争不再取决于“有多少坦克”，而在于“有多少不可见的东西在运转”。中国下定决心进行陆军军事改革，这次改革以适应现代战争的特点为目标。不再追求以量取胜，而追求精益求精，裁军的同时是向着全面半机械化与信息化建设铺路。中国陆军正式从“国土防卫”走向“全域慑战”。"
 PRC_00_MR_MECH_01: "全面推进机械化"
 PRC_00_MR_MECH_02_L: "扩产86步兵战车"
 PRC_00_MR_MECH_02_R: "改进86A步兵战车"
 PRC_00_MR_MECH_02: "扩产96式坦克"
 PRC_00_MR_MECH_03: "初步生产99式坦克"
 PRC_00_MR_LAND_02: "完善新世纪陆军体系"
 PRC_00_MR_QBB_01: "加强轻步兵训练"
 PRC_00_MR_QBB_01_desc: "中国加强轻步兵训练以应对现代战争复杂化、全域化的核心举措，当美军执着于“重装甲合成营”时，中国轻步兵正以全新的姿态证明，未来战场的胜负手，仍在于单兵与智能装备融合后迸发的创造力与韧性。这既是井冈山精神的数字觉醒，更是“以人制器”哲学对“唯武器论”的终极超越。其本质是信息化时代通过科技赋能对群众性战争思想的创造性发展。毛主席“真正的铜墙铁壁是群众”的论断正赋予全新内涵。"
 PRC_00_MR_QB_81: "扩产81式自动步枪"
 PRC_00_MR_QB_81_desc: "中国在二十世纪九十年代扩大生产81式自动步枪是应对边境冲突、军队换装需求和国防战略调整的关键举措。81式自动步枪是中国轻武器发展史上的里程碑式装备，在八十年代到九十年代期间作为解放军主力步枪，其设计融合了苏系武器可靠性与西方人机工程理念。在“简单可靠”与“精准高效”间取得完美平衡。其在军队中大规模扩产也正在验证着中国国防工业是否具有强大的大规模动员能力。"
 PRC_00_MR_QB_95: "改进95式自动步枪"
 PRC_00_MR_QB_95_desc: "95式自动步枪自1997年列装以来，其无托设计虽提升便携性，但也暴露人机功效、扩展性等问题。中国通过持续迭代升级，及发展全新191枪族实现技术突破。95式的改进是中国军工“问题驱动创新”的典范从“武器量产”转向“装备集成”，它的改进证明：武器成熟度从不是图纸决定的，而是战场与工厂间千万次反馈循环铸就的。“战场上1%的问题足以导致100%失败”。95系列的改进，正是中国军工以“战场需求”为锚点，将战士生命与胜利权重置于技术自负之上的缩影。或许它不是“完美步枪”，但无疑是中国特色单兵武器进化的必由之路。"
