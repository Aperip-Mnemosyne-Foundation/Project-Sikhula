 PRC_00_MR_MIL_01_desc: "虽然现在的外部环境并没有直接表面我们会面临一场旷日持久的大规模战争，但我们必须时刻做好准备，敌人是不会睡觉的，我们也绝不能松懈。只要军人服役一天，就要随时做好开战的准备。"