 psEcon_debugLine5: "§W税 [?psEcon_taxRate|%0]/结[?psEcon_taxPaid|%0]  支 [?psEcon_spendShare|%0]/结[?psEcon_spendPaid|%0]  货币 [?psEcon_monetaryStance|0]  兑现 [?psEcon_cover|%0]  国库 [?psEcon_treasury|%1]"
