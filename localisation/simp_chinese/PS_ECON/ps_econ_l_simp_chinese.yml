 psEcon_burstYes: "§R破裂中§W"
 psEcon_burstNo: "§W未破裂"
 psEcon_pulse: "经济脉冲"
 psEcon_pulse_desc: "已经结清的预算、产业结构和近几个月的路径，正在改变工厂产出与建设速度。"
 psLaw_standing: "长期法律"
 psLaw_standing_desc: "税法、劳动法、关税、资本管制、契约和国企特权。支持度通过 mtth 改变咬合力，不改产业的国营存量。"
 psLaw_taxTake: "有效税率"
 psLaw_taxEnforce: "税收执行"
 psLaw_laborBite: "劳动保护咬合"
 psLaw_tradeLevy: "关税楔子"
 psLaw_capitalSeal: "资本管制"
 psLaw_contractTrust: "契约可执行"
 psLaw_soePrivilege: "国企法律特权"
 psEcon_tickNow: "推进一个月"
 psEcon_tickNow_desc: "立刻结算一个月。路径记忆、债务和泡沫都会往前走一格。"
 psEcon_tickYear: "推进一年"
 psEcon_tickYear_desc: "连续结算十二个月，用来看趋势，不弹出危机事件。"
 psEcon_taxUp: "加税"
 psEcon_taxUp_desc: "税率提高两个百分点。要到下次月结才改变需求和国库。"
 psEcon_taxDown: "减税"
 psEcon_taxDown_desc: "税率降低两个百分点。需求要到下次月结才变热。"
 psEcon_spendUp: "加开支"
 psEcon_spendUp_desc: "开支份额提高两个百分点。建设要等这次预算真正付清。"
 psEcon_spendDown: "减开支"
 psEcon_spendDown_desc: "开支份额降低两个百分点。赤字要到月结才缩小。"
 psEcon_stanceEase: "放松货币"
 psEcon_stanceEase_desc: "货币政策放松一档。月结之后才会加快泡沫和建设。"
 psEcon_stanceTight: "收紧货币"
 psEcon_stanceTight_desc: "货币政策收紧一档。月结之后才会压建设和泡沫。"
 psEcon_heavyUp: "偏向重工"
 psEcon_heavyUp_desc: "重工业偏向提高。军工和船坞加快，民用工厂让出位置。"
 psEcon_heavyDown: "偏向轻工"
 psEcon_heavyDown_desc: "重工业偏向降低。民用建设相对加快。"
 psEcon_shareInv: "提高投资份额"
 psEcon_shareInv_desc: "投资在预算里的比重提高两个百分点，其余项目按比例让出。"
 psEcon_shareWel: "提高福利份额"
 psEcon_shareWel_desc: "福利比重提高两个百分点。失业压力减轻，过高的福利会拖一点产能。"
 psEcon_shareMil: "提高军费份额"
 psEcon_shareMil_desc: "军费比重提高两个百分点。军工加快，民用建设让路。"
 psEcon_therapyStart: "启动休克疗法"
 psEcon_therapyStart_desc: "三十六个月的真方案：开支被砍到中性线以下，货币钉在最紧。前一年很痛，政府能力够才慢慢恢复。"
 psEcon_therapyStop: "中止休克疗法"
 psEcon_therapyStop_desc: "停下这套方案。已经造成的失业和伤痕不会当场消失。"
 psEcon_shockFood: "粮食冲击"
 psEcon_shockFood_desc: "制造一次衰减中的粮食减产。压力会削产能、稳定性和政治点。"
 psEcon_shockOil: "能源冲击"
 psEcon_shockOil_desc: "抬高本国面对的油价。进口国的产能和建设会先受伤。"
 psEcon_shockDemand: "需求下跌"
 psEcon_shockDemand_desc: "需求突然变冷。利用率下降，失业会在后面几个月慢慢跟上。"
 psEcon_shockPrices: "物价冲击"
 psEcon_shockPrices_desc: "给通胀预期加一截。它会自己衰减，但工资和物价记得上个月。"
 psEcon_shockClear: "清除外生冲击"
 psEcon_shockClear_desc: "清掉粮食、能源、需求和物价冲击。路径记忆和泡沫还在。"
 psEcon_foodRelief: "紧急购粮"
 psEcon_foodRelief_desc: "从国库支付全年产出的0.4%，立刻补进一批粮食。救济每过一个月只剩四分之三。"
 psEcon_projectWorks: "拨款制造业项目"
 psEcon_projectWorks_desc: "连续十二个月，每月拨全年产出的0.15%。兑现不低于八成才加快建设。"
 psEcon_projectLabs: "拨款高新技术项目"
 psEcon_projectLabs_desc: "同样的拨款。兑现不低于八成才加快科研，不加快铺摊子。"
 psEcon_projectStop: "停掉大型项目"
 psEcon_projectStop_desc: "剩下的拨款不再支付，已经形成的产能修正立刻撤下。"
 psLaw_taxSupportUp: "税法：提高支持"
 psLaw_taxSupportUp_desc: "税法支持提高十个点。执行率跟着 mtth 变，不改税率滑条。"
 psLaw_taxSupportDown: "税法：降低支持"
 psLaw_taxSupportDown_desc: "税法支持降低十个点。征不上来的税不会进国库。"
 psLaw_laborSupportUp: "劳动法：提高支持"
 psLaw_laborSupportUp_desc: "解雇保护更咬得住。产能和效率上限下降，就业更稳。"
 psLaw_laborSupportDown: "劳动法：降低支持"
 psLaw_laborSupportDown_desc: "劳动法还在，但更难执行。工厂更灵活，岗位更不稳。"
 psLaw_capitalSupportUp: "管制：加强资本项目"
 psLaw_capitalSupportUp_desc: "资本管制更咬得住。外逃变少，进口技术和科研变慢。"
 psLaw_capitalSupportDown: "管制：放松资本项目"
 psLaw_capitalSupportDown_desc: "资本项目更开放。外汇更容易流失，私人科研更容易进来。"
 psLaw_soeSupportUp: "国企法：加强特权"
 psLaw_soeSupportUp_desc: "软预算和垄断权更咬得住。建设加快，政治点变贵。这不改变谁拥有工厂。"
 psLaw_soeSupportDown: "国企法：削弱特权"
 psLaw_soeSupportDown_desc: "国企的法律特权变弱。建设指令变少，财政补贴也变轻。"
 psLaw_tariffSupportUp: "关税：提高支持"
 psLaw_tariffSupportUp_desc: "关税法还在，支持更高，边境上的楔子更咬得住。进口变贵，关税现金变多。"
 psLaw_tariffSupportDown: "关税：降低支持"
 psLaw_tariffSupportDown_desc: "关税条文还在，但更难执行。进口更容易，关税进账变少。"
 psLaw_contractSupportUp: "契约法：提高支持"
 psLaw_contractSupportUp_desc: "法院和登记更咬得住。私人科研和资本更愿意留下来。"
 psLaw_contractSupportDown: "契约法：降低支持"
 psLaw_contractSupportDown_desc: "契约法还在纸上。违约和寻租变容易，私人科研变慢。"
 psInd_heavyUp: "重工：提高国营"
 psInd_heavyUp_desc: "重工业国营份额提高十个点。建设更容易，产能和科研让一点。"
 psInd_heavyDown: "重工：提高民营"
 psInd_heavyDown_desc: "重工业民营份额提高十个点。这是存量，不是一条法律。"
 psInd_lightUp: "轻工：提高国营"
 psInd_lightUp_desc: "轻工业国营份额提高十个点。出口和效率让位，就业更稳。"
 psInd_lightDown: "轻工：提高民营"
 psInd_lightDown_desc: "轻工业民营份额提高十个点。工厂产出和出口更好，泡沫更容易起。"
 psInd_techUp: "高新：提高国营"
 psInd_techUp_desc: "高新技术国营份额提高十个点。国家实验室还在，私人科研和泡沫变弱。"
 psInd_techDown: "高新：提高民营"
 psInd_techDown_desc: "高新技术民营份额提高十个点。科研和效率上升，景气时泡沫更快。"
 psInd_farmUp: "农业：提高国营"
 psInd_farmUp_desc: "农业国营份额提高十个点。征购更稳，单产更差，补贴更重。"
 psInd_farmDown: "农业：提高民营"
 psInd_farmDown_desc: "农业民营份额提高十个点。粮食供给更好，国家收购更弱。"
 psInd_energyUp: "能源：提高国营"
 psInd_energyUp_desc: "能源国营份额提高十个点。供应更稳，建设更快，财政要养它。"
 psInd_energyDown: "能源：提高民营"
 psInd_energyDown_desc: "能源民营份额提高十个点。补贴变轻，能源安全变差。"
 ps_econ.1.t: "泡沫裂开了"
 ps_econ.1.d: "账上的好光景停了。产能 [?psEcon_factory|%1]，建设 [?psEcon_buildCiv|%1]，泡沫还剩 [?psEcon_bubble|%0]。出清会痛一阵。托底会改开支和货币，但要到下次月结才进产能。"
 ps_econ.1.a: "让它出清"
 ps_econ.1.b: "拿开支和松货币托底"
 ps_econ.2.t: "粮食不够吃"
 ps_econ.2.d: "粮食平衡是 [?psEcon_foodBalance|2]。缺口已经在削工厂产出和政治稳定。可以硬扛，也可以从国库买一批应急粮，这批粮会在几个月里消耗掉。"
 ps_econ.2.a: "硬扛过去"
 ps_econ.2.b: "紧急购粮"
 ps_econ.3.t: "物价脱开了锚"
 ps_econ.3.d: "通胀 [?psEcon_inflation|%1]，而市场记得的物价还在 [?psEcon_inflationSlow|%1]。收紧货币要到下次月结才压建设。"
 ps_econ.3.a: "先看着"
 ps_econ.3.b: "收紧一档货币"
 ps_econ.4.t: "债主开始疑心"
 ps_econ.4.d: "债务 [?psEcon_debt|%0]，市场信心 [?psEcon_marketStock|%0]。利息会进下一次国库账单。砍开支要到月结才让需求变冷。"
 ps_econ.4.a: "接受更贵的债"
 ps_econ.4.b: "削减开支"
 ps_econ.5.t: "休克疗法到期"
 ps_econ.5.d: "三十六个月走完了。眼下增长 [?psEcon_growth|%1]，产能 [?psEcon_factory|%1]，失业 [?psEcon_unemployment|%1]。方案可以停在这里，也可以把砍掉的开支还回两个百分点。"
 ps_econ.5.a: "把新的开支水平留下"
 ps_econ.5.b: "把开支加回去一点"
 ps_econ_news.1.t: "粮食涨价"
 ps_econ_news.1.d: "国际粮价抬了一截。缺粮的国家会先感到工厂和稳定性的压力，有贸易渠道的国家还能补上一部分。"
 ps_econ_news.1.a: "知道了"
 ps_econ_news.2.t: "油价跳动"
 ps_econ_news.2.d: "国际油价跳了一截。能源靠进口的国家，产能、建设和物价会一起感到这一下。"
 ps_econ_news.2.a: "知道了"
