l_simp_chinese:
 psEcon_debugCategory: "经济脉冲"
 psEcon_debugCategory_desc: "调试用月度账本。地图建筑不参与计算，结果直接改产能和建设速度。"
 psEcon_debugLine1: "人均 §Y[?psEcon_income|1]§! 千美元  增长 §Y[?psEcon_growth|%1]§!  潜能 [?psEcon_potential|%1]  过热 [?psEcon_heat|%2]"
 psEcon_debugLine2: "通胀 [?psEcon_inflation|%1]  失业 [?psEcon_unemployment|%1]  债务 [?psEcon_debt|%0]  赤字 [?psEcon_deficit|%1]"
 psEcon_debugLine3: "路径稳定 [?psEcon_stability|%0]  动能 [?psEcon_momentum|%2]  波动 [?psEcon_volatility|%2]  泡沫 [?psEcon_bubble|%0]  [Get_psEcon_burst]  伤痕 [?psEcon_balanceSheet|%0]"
 psEcon_debugLine4: "产能 §Y[?psEcon_factory|%1]§!  民工 [?psEcon_buildCiv|%1]  军工 [?psEcon_buildMil|%1]  船坞 [?psEcon_buildDock|%1]  修复 [?psEcon_repair|%1]"
 psEcon_debugLine5: "税 [?psEcon_taxRate|%0]  支 [?psEcon_spendShare|%0]  货币 [?psEcon_monetaryStance|0]  重工偏向 [?psEcon_heavyBias|%0]  休克剩余 [?psEcon_therapyLeft|0] 月"
 psEcon_debugLine6: "粮食 [?psEcon_foodBalance|2]  救济 [?psEcon_foodRelief|2]  能源 [?psEcon_energyCover|2]  政府 [?psEcon_govStock|%0]  市场 [?psEcon_marketStock|%0]"
 psEcon_burstYes: "§R破裂中§!"
 psEcon_burstNo: "未破裂"
 psEcon_pulse: "经济脉冲"
 psEcon_pulse_desc: "近几个月的增长路径、泡沫和财政选择，正在改变工厂产出与建设速度。"
 psEcon_tickNow: "推进一个月"
 psEcon_tickNow_desc: "立刻结算一个月。路径记忆、债务和泡沫都会往前走一格。"
 psEcon_tickYear: "推进一年"
 psEcon_tickYear_desc: "连续结算十二个月，用来看趋势，不弹出危机事件。"
 psEcon_taxUp: "加税"
 psEcon_taxUp_desc: "税率提高两个百分点。收入增加，需求变冷。"
 psEcon_taxDown: "减税"
 psEcon_taxDown_desc: "税率降低两个百分点。需求变热，赤字变大。"
 psEcon_spendUp: "加开支"
 psEcon_spendUp_desc: "开支份额提高两个百分点。建设和福利受益，赤字上升。"
 psEcon_spendDown: "减开支"
 psEcon_spendDown_desc: "开支份额降低两个百分点。赤字缩小，需求变冷。"
 psEcon_stanceEase: "放松货币"
 psEcon_stanceEase_desc: "货币政策放松一档。泡沫膨胀得更快，建设也会跟着热。"
 psEcon_stanceTight: "收紧货币"
 psEcon_stanceTight_desc: "货币政策收紧一档。能给泡沫降温，也会压住当下的建设。"
 psEcon_heavyUp: "偏向重工"
 psEcon_heavyUp_desc: "重工业偏向提高。军工和船坞加快，民用工厂让出位置。"
 psEcon_heavyDown: "偏向轻工"
 psEcon_heavyDown_desc: "重工业偏向降低。民用建设相对加快。"
 psEcon_shareInv: "提高投资份额"
 psEcon_shareInv_desc: "投资在预算里的比重提高两个百分点，其余项目按比例让出。"
 psEcon_shareWel: "提高福利份额"
 psEcon_shareWel_desc: "福利比重提高两个百分点。消费品占用上升，民用建设相对变慢。"
 psEcon_shareMil: "提高军费份额"
 psEcon_shareMil_desc: "军费比重提高两个百分点。军工加快，民用建设让路。"
 psEcon_therapyStart: "启动休克疗法"
 psEcon_therapyStart_desc: "三十六个月的真方案：开支被砍到中性线以下，货币钉在最紧。前一年很痛，政府能力够才慢慢恢复。"
 psEcon_therapyStop: "中止休克疗法"
 psEcon_therapyStop_desc: "停下这套方案。已经造成的失业和伤痕不会当场消失。"
 psEcon_shockFood: "粮食冲击"
 psEcon_shockFood_desc: "制造一次衰减中的粮食减产。压力会削产能、稳定性和政治点。"
 psEcon_shockOil: "能源冲击"
 psEcon_shockOil_desc: "抬高本国面对的油价。进口国的产能和建设会先受伤。"
 psEcon_shockDemand: "需求下跌"
 psEcon_shockDemand_desc: "需求突然变冷。利用率下降，失业会在后面几个月慢慢跟上。"
 psEcon_shockPrices: "物价冲击"
 psEcon_shockPrices_desc: "给通胀预期加一截。它会自己衰减，但工资和物价记得上个月。"
 psEcon_shockClear: "清除外生冲击"
 psEcon_shockClear_desc: "清掉粮食、能源、需求和物价冲击。路径记忆和泡沫还在。"
 psEcon_foodRelief: "紧急购粮"
 psEcon_foodRelief_desc: "立刻补进一截粮食，并让开支升高一个百分点。救济每过一个月只剩四分之三。"
 psEcon_addFroth: "吹一截泡沫"
 psEcon_addFroth_desc: "泡沫存量提高。没破的时候产能和建设会更好看，收紧货币或继续吹就可能破裂。"
 ps_econ.1.t: "泡沫裂开了"
 ps_econ.1.d: "账上的好光景停了。产能 [?psEcon_factory|%1]，建设 [?psEcon_buildCiv|%1]，泡沫还剩 [?psEcon_bubble|%0]。出清会痛一阵。托底能把需求接住，但债务和下一轮热度也不会客气。"
 ps_econ.1.a: "让它出清"
 ps_econ.1.b: "拿开支和松货币托底"
 ps_econ.2.t: "粮食不够吃"
 ps_econ.2.d: "粮食平衡是 [?psEcon_foodBalance|2]。缺口已经在削工厂产出和政治稳定。可以硬扛，也可以花钱买一批应急粮，这批粮会在几个月里消耗掉。"
 ps_econ.2.a: "硬扛过去"
 ps_econ.2.b: "紧急购粮"
 ps_econ.3.t: "物价脱开了锚"
 ps_econ.3.d: "通胀 [?psEcon_inflation|%1]，而市场记得的物价还在 [?psEcon_inflationSlow|%1]。继续放着，预期会自己咬住增长。收紧货币会压建设，但能把热度按下去。"
 ps_econ.3.a: "先看着"
 ps_econ.3.b: "收紧一档货币"
 ps_econ.4.t: "债主开始疑心"
 ps_econ.4.d: "债务 [?psEcon_debt|%0]，市场信心 [?psEcon_marketStock|%0]。利息会吃掉增长，建设也会慢下来。砍开支能把赤字按住，需求则要再冷一截。"
 ps_econ.4.a: "接受更贵的债"
 ps_econ.4.b: "削减开支"
 ps_econ.5.t: "休克疗法到期"
 ps_econ.5.d: "三十六个月走完了。眼下增长 [?psEcon_growth|%1]，产能 [?psEcon_factory|%1]，失业 [?psEcon_unemployment|%1]。方案可以停在这里，也可以把砍掉的开支还回两个百分点。"
 ps_econ.5.a: "把新的开支水平留下"
 ps_econ.5.b: "把开支加回去一点"
 ps_econ_news.1.t: "粮食涨价"
 ps_econ_news.1.d: "国际粮价抬了一截。缺粮的国家会先感到工厂和稳定性的压力，有贸易渠道的国家还能补上一部分。"
 ps_econ_news.1.a: "知道了"
 ps_econ_news.2.t: "油价跳动"
 ps_econ_news.2.d: "国际油价跳了一截。能源靠进口的国家，产能、建设和物价会一起感到这一下。"
 ps_econ_news.2.a: "知道了"