 # 2001年剧本
 BLITZKRIEG_2001: "2001年 - 全频带阻塞干扰"
 BLITZKRIEG_2001_DESC: "当北约与日军俄军联手展开电子风暴，中国防线岌岌可危。唯一破局之策，『万年炎帝』号飞船燃尽核聚变能量，撞向太阳，引爆全频带电磁风暴，切断一切无线电通讯。黑暗中，战士重拾刺刀，以血肉之躯迎接新一轮较量，唯有勇气与智慧，方能在断网黎明中铸就中国反击之路！"
 
 # 中国国家简介
 CHI_MILLENNIUM_DAWN_DESC: "2001年北约突袭致中国丧失制空权，启动『全频带阻塞干扰』瘫痪敌指挥系统却自断信息化战力，『万年炎帝』号太空站成终极威慑，深陷国际孤立仅朝鲜暗援——以血肉长城对抗数字洪流，抉择是否点燃太阳风暴逆转绝境。"