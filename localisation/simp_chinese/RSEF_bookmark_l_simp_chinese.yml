l_simp_chinese:
 1998_NAME: "星火燎原"
 1998_DESC: "历史的车轮已经走到了1998年，世纪交替下的地球却不怎么平静。西欧巨变和苏联的解体给整个社会主义世界带来了巨大的打击，亲美政府在俄罗斯的支持率居高不下，即将到来的俄罗斯总统选举或将改变世界格局；中国的改革开放已经持续了20年，中国经济的飞速发展让美国感受到了巨大的威胁，中央军委在海湾战争和新一轮台海危机的刺激下准备进行军改。一场猛烈的山火只需要星火即可燎原。"

 1998_PRC_DESC: "自三年前希特勒的第三帝国取代魏玛共和国以来，一个涅槃新生的德意志已然崛起。现在，大萧条最艰难的年头已经过去，大规模失业正得到有效控制，经济秩序也已重归稳定。\n\n如今，凡尔赛和约对德国所施加的军备限制早已被抛诸脑后。随着国防军的日益壮大，又一场世界大战已初露端倪。"