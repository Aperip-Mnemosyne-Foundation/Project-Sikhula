l_simp_chinese: 
 # 注意此爲PRC國策本地化 請勿在此填寫無關内容 
 # 国策的ID为 TAG_FOCUSTREEID_PROJECT_ID 
 # PRC 00
 # 軍改國策 MR
 PRC_00_MR_01: "海湾战争的警钟" #######
 PRC_00_MR_01_desc: ""
 PRC_00_MR_02: "设立总装备部"
 PRC_00_MR_02_desc: "现代战争需要完善的装备体系，现有的装备制度完全无法适应，我们需要一个新的部门，这个部门能统一全军的发展计划，装备新的武器，使用新的体系，来适应新时期的战争需要。"
 PRC_00_MR_03: "禁止军队经商"
 PRC_00_MR_03_desc: "虽然军队经商是几年前中央军委为了经济建设专门放开过的，虽然军队经商也缓解了我们财政上的不足，也促进了市场的发展。但我们不得不承认的是，军队经商的利只能维持一时，而之后的弊端会越来越大，前不久的两个案子就是最直接的证据。军人的本质是打仗，什么经商之类腐蚀军队战斗力的全给我见鬼去吧！"
 PRC_00_MR_04: "世纪交替的军改"
 PRC_00_MR_04_desc: "千禧年将至，以北约为首的西方国家失去了苏联的威胁，我们不得不重视这个难以想象的战斗力。眼下，我国经济刚刚开始有起色，犯罪率也开始降低，我们的军改任务越来越重，国外的武装势力正对我们虎视眈眈，我们必须在这个特殊的时候完成我们的军事改革。"
 PRC_00_MR_05: "推进指挥自动化"
 PRC_00_MR_05_desc: "如果士兵是一只部队的身体，那么指挥官就是他的脑袋。传统的指挥方式效率低下，且遇到突发情况难以应对，指挥链的自动化不仅能加快我们的指挥效率，还能为我们的军队战力带来大幅度提升。"
 PRC_00_MR_LAND_01: "陆军改革"
 PRC_00_MR_LAND_01_desc: "1991年的海湾战争如同一面棱镜，折射出工业时代战争与信息时代战争的鸿沟。它不仅惊醒了中国的军事改革，更重塑了国防现代化的底层逻辑：打赢战争不再取决于“有多少坦克”，而在于“有多少不可见的东西在运转”。中国下定决心进行陆军军事改革，这次改革以适应现代战争的特点为目标。不再追求以量取胜，而追求精益求精，裁军的同时是向着全面半机械化与信息化建设铺路。中国陆军正式从“国土防卫”走向“全域慑战”。"
 PRC_00_MR_MECH_01: "全面推进机械化"
 PRC_00_MR_MECH_01_desc: "为适应现代战争需求，国家决定全面推进陆军机械化建设，提升部队快速机动和火力打击能力。通过优化装备结构，逐步淘汰老旧装备，实现机械化部队的全域覆盖和高效协同作战。"
 PRC_00_MR_MECH_02_L: "扩产86步兵战车"
 PRC_00_MR_MECH_02_L_desc: "为满足部队装备需求，国家启动86型步兵战车扩产计划。该战车具备良好的机动性和防护能力，适用于多种复杂地形作战。通过扩大生产规模，确保前线部队装备充足，同时推动相关产业链升级，提升国产化率。"
 PRC_00_MR_MECH_02_R: "改进86A步兵战车"
 PRC_00_MR_MECH_02_R_desc: "在86型基础上，国家立项改进86A型步兵战车，重点提升其火力系统、防护性能和信息化水平。改进后的战车将配备新型武器系统和数字化指挥系统，显著增强战场生存能力和作战效能，为部队提供更强大的火力支援。"
 PRC_00_MR_MECH_02: "扩产96式坦克"
 PRC_00_MR_MECH_02_desc: "96式坦克作为陆军主力装备，其扩产计划旨在进一步提升装甲部队的战斗力。通过规模化生产和技术优化，降低制造成本，确保装备供应稳定。同时，加强人员培训，保障坦克部队的快速形成战斗力。"
 PRC_00_MR_MECH_03: "初步生产99式坦克"
 PRC_00_MR_MECH_03_desc: "为打造现代化装甲力量，国家启动99式坦克的初步生产。99式坦克集成了先进火力、防护和机动技术，代表国内坦克制造的最高水平。通过小批量生产和技术验证，逐步完善生产线，为未来大规模列装奠定基础。"
 PRC_00_MR_LAND_02: "完善新世纪陆军体系"
 PRC_00_MR_LAND_02_desc: "这是中国陆军现代化转型的关键节点，其改革举措既是对海湾战争信息化作战模式的回应，也是应对国内安全环境与国防资源约束的战略调整。此次改革的核心是“精兵合成、提质增效”，通过编制重组、装备升级和制度创新，将为21世纪陆军体系建设奠定基础。“改革从无坦途，但强军必涉深水。” 其真正的核心，在于用一场自我革命证明：大国陆军的尊严，不在兵员之众，而在变革之勇。"
 PRC_00_MR_QBB_01: "加强轻步兵训练"
 PRC_00_MR_QBB_01_desc: "中国加强轻步兵训练以应对现代战争复杂化、全域化的核心举措，当美军执着于“重装甲合成营”时，中国轻步兵正以全新的姿态证明，未来战场的胜负手，仍在于单兵与智能装备融合后迸发的创造力与韧性。这既是井冈山精神的数字觉醒，更是“以人制器”哲学对“唯武器论”的终极超越。其本质是信息化时代通过科技赋能对群众性战争思想的创造性发展。毛主席“真正的铜墙铁壁是群众”的论断正赋予全新内涵。"
 PRC_00_MR_QB_81: "扩产81式自动步枪"
 PRC_00_MR_QB_81_desc: "中国在二十世纪九十年代扩大生产81式自动步枪是应对边境冲突、军队换装需求和国防战略调整的关键举措。81式自动步枪是中国轻武器发展史上的里程碑式装备，在八十年代到九十年代期间作为解放军主力步枪，其设计融合了苏系武器可靠性与西方人机工程理念。在“简单可靠”与“精准高效”间取得完美平衡。其在军队中大规模扩产也正在验证着中国国防工业是否具有强大的大规模动员能力。"
 PRC_00_MR_QB_95: "改进95式自动步枪"
 PRC_00_MR_QB_95_desc: "95式自动步枪自1997年列装以来，其无托设计虽提升便携性，但也暴露人机功效、扩展性等问题。中国通过持续迭代升级，及发展全新191枪族实现技术突破。95式的改进是中国军工“问题驱动创新”的典范从“武器量产”转向“装备集成”，它的改进证明：武器成熟度从不是图纸决定的，而是战场与工厂间千万次反馈循环铸就的。“战场上1%的问题足以导致100%失败”。95系列的改进，正是中国军工以“战场需求”为锚点，将战士生命与胜利权重置于技术自负之上的缩影。或许它不是“完美步枪”，但无疑是中国特色单兵武器进化的必由之路。"
 PRC_00_MR_QBB_02: "强化基层指挥组织"
 PRC_00_MR_QBB_02_desc: "基层指挥组织强化改革的真正核心，在于将指挥神经末梢打造成决策尖刀——今日高原边防班长用平板电脑召唤火力支援的场景，正是这场变革能够跨越时空的回响。“军队改革必然会触及既得利益，但强军之路从无坦途。”"
 PRC_00_MR_QBB_03: "强化民兵训练与预畚役体系"
 PRC_00_MR_QBB_03_desc: "强化民兵训练与预备役体系是我国国防动员体系现代化建设的核心任务，是应对安全威胁与国力限制的务实选择，在枷锁当中蓄力。在裁军阵痛期，后备力量要甘当兜底的网。这张网虽显陈旧，却是在为中国现代陆军未来的飞跃保留火种。"
 PRC_00_MR_AIR_01: "空军革新"
 PRC_00_MR_AIR_L: "加速研发歼-10"
 PRC_00_MR_AIR_R: "引进苏27"
 PRC_00_MR_AIR_02: "国产化战机配件"
 PRC_00_MR_AIR_03: "扩产新式国产战机"
 PRC_00_MR_AIR_04: "升级国土防空"
 PRC_00_MR_AIR_05: "追赶先进空军体系"
 PRC_00_MR_SEA_01: "近海海军"
 PRC_00_MR_SEA_01_desc: "我国目前海军实力薄弱，有着各种重要短板。舰艇种类存在严重失衡。海湾战争中伊拉克面对美国海军的无力以及南海主权问题受到严重威胁也提醒了我们：海军在现代战争中的作用比我们想象中的更为重要。如果我们仍旧轻视海军，那么我们的本土便会成为敌人训练海军登陆的最佳场地。敌军也会肆意地切断大陆与台湾之间的联系。近些年来美国与日本的咄咄逼人在不断的提醒我们：剩下的时间不多了，我们必须尽快完成现代化海军的建设。否则“有海无防”只会让我们沦为下一个伊拉克！"
 PRC_00_MR_SEA_02: "近海防御"
 PRC_00_MR_SEA_02_desc: "海湾战争中伊拉克被美国海军封锁，导致其在战争中迅速溃败，而我国领导人也意识到一点：在面对美帝国主义的入侵时，必需拿起独属于我们的刀刃反抗。值得庆幸的是经过一系列的海军改革，我国舰艇的各个性能都得到了显著的提升。接下来我们只需要提出一个合理的战术并加以应用，那么我国便可以跻身海军强国。近些年来我国将近海防御纳入全军战略，并提供了详细的解析即：捍卫主权，破坏敌方海军干扰。我们现阶段需要学会应用“近海防御”策略以促进现代化海军的建设，保卫中国领海的主权不受侵犯。建设起独属于我们的“钢铁长城”，让伊拉克的悲剧不会在东亚地区重现。"
 PRC_00_MR_SEA_03: "立足空潜快体系"
 PRC_00_MR_SEA_03_desc: "我国虽然进行了一系列的海军改革，但面对美国海军入侵时，我国那新兴海军依旧不堪一击。但我国新提出了“空潜快体系”利用机动性极高的潜艇以及快艇配合空军进行协同作战。这种方式不仅大大降低了近海防御的成本，而且这种机动防御能够使我国在面对敌方海军时更加有组织有纪律的予以反制。在海军改革的过程中，我国将空潜快体系所需要装备都予以扩产。因此我们能够空出大量装备进行武装我国的领海。在敌军出现时能够及时的捍卫主权，让甲午海战以及海湾战争的悲剧不会再一次的出现在我国海域，能够真正的中断中华民族的百年屈辱！"
 PRC_00_MR_SEA_L_01: "扩产歼轰7"
 PRC_00_MR_SEA_L_01_desc: "海湾战争中美国海军与空军的配合令我们瞠目结舌。这意味着现代化战争已经不再仅仅是个人英雄主义式的战斗，而是各个兵种协同作战的结果。由我国完全自主研发的超音速战斗轰炸机——歼轰七，填补了我国舰载轰炸机空缺。在反舰任务上其表现的十分出色，但由于我国工业实力较为薄弱，技术问题依旧困扰着我们。生产出来的歼轰七数量十分有限。我们应该加紧歼轰七的生产，以配合海军进行协同作战。促进现代化战争建设计划的实施。"
 PRC_00_MR_SEA_L_02: "改进039型潜艇"
 PRC_00_MR_SEA_L_02_desc: "039型潜艇是我国潜艇发展史上的里程碑，但仍有许多不足之处等着我们改进、如静音性差、AIP系统缺失以及可靠性不足等。如果我们不去革新而直接生硬运用于战场，就无异于自杀式袭击。我们需要对它进行一次大范围的改良，以便于适应今后战场上的风云变化。对它进行革新的过程中，我们也可以得出被“卡脖子”的核心技术问题的优秀解决方案。这种利大于弊的方案我们应当尽快完成！"
 PRC_00_MR_SEA_L_03: "扩产022型导弹艇"
 PRC_00_MR_SEA_L_03_desc: "我国新提出了“非对称作战理论”这种战术可以使我们在面对美国海军时不会手足无措。但这种战术对于导弹艇有着巨大的需求。对比于021型导弹艇，022型导弹艇的性能在各个方面上都有显著的提升。不仅在我国新提出的战术上有着卓越表现，而且它的造价低廉，适合扩产。而面对我国目前巨大的战略需求，以及为了弥补我国海军领域的空缺，应当对022型导弹艇进行扩产。以适应新时代海军战术的革新。"
 PRC_00_MR_SEA_R_01: "放眼未来"
 PRC_00_MR_SEA_R_01_desc: "不管是潜艇还是巡洋舰，都被划为近海防御的重要武器。但是我们应当将目光投向远处，不管是二战中还是二战以后的现代化战争，跨大洋的持续作战能力一直在主导着战场的局势。如果我们只能守卫大陆面前的一亩三分地，那么我们的海军将会受到持续性的压制。因此，我们应当尽快将建设航空母舰以及驱逐舰等等所具备远洋技术的舰艇的建设提上日程。将现代化海军建设计划作为我们的重要任务。"
 PRC_00_MR_SEA_R_02: "远洋技术储备"
 PRC_00_MR_SEA_R_02_desc: "信息化作为现代化战争的重要标志，在海湾战争中便具象化的体现出来。如果我们不能掌握信息化技术，那么我们也将无法踏入现代化海军强国的大门；技术代差也一直是困扰我们多年的问题，我们应当找到一个最合理的方案去打破代沟，否则我们与美国的差距只会愈来愈远……种种问题始终困扰着我们，在那一天来临之前，我们必须找到最佳的解决方案以真正的掌握远洋技术。"
 PRC_00_MR_SEA_R_03: "购买航母"
 PRC_00_MR_SEA_R_03_desc: "例如乌克兰近期宣布准备出售的“瓦良格”航母，如果我们买下并进行自主技术攻关，这就不仅能够提供宝贵的经验，而且在改装外国航母的过程中，我们也能够得出各种核心技术问题的解决方案，并大大缩短我国航母技术的积累周期。如果我国错失了此次良机，那么丢失的技术力将会化为美国悬在我们头上的一把利刃。因此我们必须进行广泛的航母购买，并进行自主技术攻关。以便于更高效的发展我国海军大业。"
 PRC_00_MR_BACKUP_01: "后勤体系精简化"
 PRC_00_MR_BACKUP_01_desc: "现代战争物资消耗剧增、保障时效性要求高，而传统后勤模式效率低、成本高，挤占核心军事资源。为提升军事后勤效率，我国积极推进后勤体系改革，改革核心是构建三军联勤与社会化保障机制：通过体制改革，成立总装备部，统筹装备全寿命管理，推行三军联勤；社会化保障，将非作战任务移交社会；规模精简，配合裁军政策，剥离冗余后勤职能。改革充分降低后勤成本、保障工作效率，为军队聚焦作战职能及后续信息化转型奠定基础。"
 PRC_00_MR_BACKUP_02: "强化二炮部队"
 PRC_00_MR_BACKUP_03: "综合后勤支援体系"
 PRC_00_MR_BACKUP_L_01: "预算管理改革"
 PRC_00_MR_BACKUP_L_01_desc: "预算管理改革是精简后勤体系的重要部分，其核心是建立全流程经费管控体系。打破基数增长惯例，按任务实际需求核定经费；实施“分项限额管理”，对装备采购、物资储备、设施维护等大类支出设定刚性上限；设立军队财务结算中心，统一支付结算，压缩预算外开支；同步强化审计监督前置机制，对重大项目实行预算执行动态评估。从源头上杜绝了军兵种挤占挪用，并标准化成本定额，实现后勤支出可量化、可追溯管控。"
 PRC_00_MR_BACKUP_L_02: "建立现代后勤信息系统"
 PRC_00_MR_BACKUP_L_02_desc: "后勤信息系统建设以全军物资编目系统为基础，强制推行13位标准物资编码，统一陆海空三军40万类物资标识。建成覆盖军区、集团军、师团三级的后勤指挥信息网，联通全军200余个物资储备库和运输枢纽，实现需求提报、库存调拨、在途运输全流程电子化管控。核心突破在于部署动态可视系统：通过电子标签与定位技术，对重点作战物资实施从仓库到战位的实时追踪，战场物资申领周期从72小时压缩至8小时。同时建立后勤数据库，归集油料消耗、装备维修等历史数据，为预算精准核拨提供决策支撑。"
 PRC_00_MR_BACKUP_L_03: "医疗体制改革"
 PRC_00_MR_BACKUP_L_03_desc: "医疗体制改革源于解决机构臃肿、资源分散及低效问题，通过整合医疗保障职能、优化资源配置，削减冗余层级以提升战备效率；改革效果显著，实现了医疗资源的集中管理和标准化保障，缩短了伤病员救治周期，降低了运行成本，同时通过引入军民协同机制（如药品集中采购和部分保障社会化），增强了战时医疗支援能力，为整体战斗力生成提供了高效可持续的后勤支撑。"
 PRC_00_MR_BACKUP_R_01: "物资采购制度改革"
 PRC_00_MR_BACKUP_R_01_desc: "后勤体系精简化项目聚焦于物资采购制度改革。传统分散采购模式致使机构重叠、资源浪费等问题突出，亟需改革。为此，项目着力构建集中统一采购机制，整合三军采购需求，设立专业化管理机构，并引入市场竞争及电子化平台，实现采购流程规范化与透明化。改革后，采购周期大幅压缩，运行成本显著降低，规模效应显现，经费节省可观，权力寻租行为得到有效遏制。同时，依托军民协同机制，如完善协议供应商制度，战备物资保障效能得到切实提升。"
 PRC_00_MR_BACKUP_R_02: "完善装备维修保障体系"
 PRC_00_MR_BACKUP_R_03: "后勤教育和人才培养改革"
 PRC_00_MR_MIL_01: "整军备战"
 PRC_00_MR_MIL_01_desc: "虽然现在的外部环境并没有直接表面我们会面临一场旷日持久的大规模战争，但我们必须时刻做好准备，敌人是不会睡觉的，我们也绝不能松懈。只要军人服役一天，就要随时做好开战的准备。"
 # PRC 01
 # 第一阶段 FS
 PRC_01_FS_NEWYEAR: "新的一年" #######
 PRC_01_FS_NEWYEAR_desc: "雪落在1997年的最后一天，新一年的钟声即将敲响，在过去的1997年，香港顺利回归，中共十五大成功召开并制定了跨世纪的发展纲领，并且继承伟大的改革开放总设计师邓小平的遗志继续推进中国特色社会主义的建设。北京中南海传来国家主席江泽民的新年贺词。中国人民对中国与世界的未来充满信心。我们愿与各国人民一道，为创造一个和平、稳定、繁荣、进步的新世界而努力奋斗！"
 PRC_01_FS_AEE: "亚洲金融危机的影响"
 PRC_01_FS_AEE_desc: "亚洲金融危机对1998年中国的影响会是深远的一把“双刃剑”，它既带来严峻挑战和社会阵痛，引发城乡分化加剧以及下岗潮的沉重代价，又倒逼了国家不得不进行关键改革，是否会重塑了中国经济发展路径？但是无论如何这对于中国来讲都是一场不得不打的硬仗。"
 PRC_01_FS_IE: "加强金融监管"
 PRC_01_FS_IE_desc: "在亚洲金融危机之中暴露了中国金融监管的漏洞，资本外逃，以虚构进口合同购汇转移资金的情况时有发生。1998年的金融监管强化将会是一场刀刃向内的自救改革，这将会是一场外科手术式的整顿，切除毒瘤，以资本管制铁腕锁死出血点。"
 PRC_01_FS_RMB: "坚持人民币不贬值"
 PRC_01_FS_RMB_desc: "中国将坚持人民币不贬值的决策，这一选择关乎了中国国家信誉与国际责任。这一政策不仅将要重塑亚洲经济格局，更会深刻地影响中国自身的金融改革与发展路径。在东南亚经济陷入瘫痪，中国出口骤降，国际舆论纷纷散布“人民币贬值”谣言而借此狙击香港股市。国务院总理朱镕基宣布人民币将不会贬值，希望以短期阵痛换取长期的主权信用。"
